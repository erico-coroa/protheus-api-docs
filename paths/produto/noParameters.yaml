get:
  tags:
    - Produto
  summary: EndPoint para retornar os produtos
  operationId: getAllProdutos
  parameters:
    # - name: "Authorization"
    #   in: query
    #   description: Código em base64 de autorização (USUARIO:SENHA)
    #   required: true
    #   schema:
    #     type: string
    #     example: Basic XXXXXXX
    # - name: "ambiente_dev"
    #   in: query
    #   description: Direcionar para ambiente de desenvolvimento
    #   required: false
    #   schema:
    #     type: string
    #     example: true
    # - name: "ecommerce"
    #   in: query
    #   description: Filtrar apenas por produtos ecommerce, com campo B5_ECFLAG = 1
    #   required: false
    #   schema:
    #     type: string
    #     example: "true"
    - name: "tenantId"
      in: header
      description: TenantId (EMPRESA,FILIAL)
      required: false
      schema:
        type: string
        example: 01,01
    - name: "pageNumber"
      in: query
      description: Número da página
      required: false
      schema:
        type: number
        # example: "1"
    - name: "pageSize"
      in: query
      description: Quantidade de itens por página
      required: false
      schema:
        type: number
        # example: "100"
    - name: "updatedAt"
      in: query
      description: Filtro de atualização (yyyy-mm-dd)
      required: false
      schema:
        type: string
    - name: "fieldsRet"
      in: query
      description: Filtro de campo (B1_FILIAL,B1_COD,B5_COD,...)
      required: false
      schema:
        type: string
    - name: "codigo"
      in: query
      description: Número do código do produto
      required: false
      schema:
        type: string
        # example: "000001"
    - name: "tipo"
      in: query
      description: Tipo do produto
      required: false
      schema:
        type: string
        # example: "000001"
  responses:
    "200":
      description: Successful response
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              data:
                type: array
                items:
                  $ref: "./schemas/SB1+SB5.yaml"
              hasNext:
                type: boolean
                example: true
    "400":
      description: Invalid input
      content:
        application/json:
          schema:
            type: object
            properties:
              errorCode:
                type: integer
                example: 400
              errorMessage:
                type: string
                example: Descrição do erro.
    "404":
      description: Invalid input
      content:
        application/json:
          schema:
            type: object
            properties:
              errorCode:
                type: integer
                example: 404
              errorMessage:
                type: string
                example: Nenhum registro encontrado.
    "500":
      description: Invalid input
      content:
        application/json:
          schema:
            type: object
            properties:
              errorCode:
                type: integer
                example: 500
              errorMessage:
                type: string
                example: Descrição do erro.
  security:
    - basicAuth: []
