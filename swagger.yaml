openapi: 3.0.0
info:
  title: API Coroa | TOTVS Protheus
  description: Documentação técnica das APIs de integração com o ERP TOTVS Protheus da Coroa.
  version: 1.0.0
  termsOfService: https://coroa.com.br/politica-de-privacidade/
  contact:
    name: Grupo Coroa 
    url: https://coroa.com.br/fale-conosco/
    email: sac@coroa.com.br
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: "http://189.50.2.244:8155/rest/"
    description: Development server
  - url: 'http://189.50.2.244:8370/rest/'
    description: Production server
tags:
  - name: Produto
  - name: Fornecedor
  - name: Transportadora
  - name: GrupoDeProdutos
  - name: Natureza
  - name: CentroDeCusto
  - name: CondicaoDePagamento
  - name: LocaisDeEstoque
  - name: UnidadeDeMedida
  - name: ContaContabil
  - name: SolicitacaoDeCompra
  - name: PedidoDeCompra

security:
  - basicAuth: []

paths:
  /coroaproduto/api/v1/produto:
    $ref: './paths/produto/config.yaml'

  /coroafornecedor/api/v1/fornecedor:
    $ref: './paths/fornecedor/config.yaml'

  /transportadora/api/v1/transportadora:
    $ref: './paths/transportadora/config.yaml'

  /coroagpprodutos/api/v1/grupoDeProdutos:
    $ref: './paths/grupoDeProdutos/config.yaml'

  /coroanatureza/api/v1/natureza:
    $ref: './paths/natureza/config.yaml'
  
  /coroacentrodecusto/api/v1/centroDeCusto:
    $ref: './paths/centroDeCusto/config.yaml'
  
  /coroacondicaopagamento/api/v1/condicaoDePagamento:
    $ref: './paths/condicaoDePagamento/config.yaml'

  /locaisdeestoque/api/v1/locaisDeEstoque:
    $ref: './paths/locaisDeEstoque/config.yaml'

  /coroaunidademedida/api/v1/unidadeDeMedida:
    $ref: './paths/unidadeDeMedida/config.yaml'

  /coroacontacontabil/api/v1/contaContabil:
    $ref: './paths/contaContabil/config.yaml'

  /solicitacaocompra/api/v1/solicitacaoDeCompra:
    $ref: './paths/solicitacaoDeCompra/config.yaml'

  /pedidodecompra/api/v1/pedidoDeCompra:
    $ref: './paths/pedidoDeCompra/config.yaml'
  
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic

  schemas:
    Produto:
      $ref: "./paths/produto/schemas/SB1+SB5.yaml"

    Fornecedor:
      $ref: "./paths/fornecedor/schemas/SA2.yaml"

    Transportadora:
      $ref: "./paths/transportadora/schemas/SA4.yaml"

    GrupoDeProdutos:
      $ref: "./paths/grupoDeProdutos/schemas/SBM.yaml"
   
    Natureza:
      $ref: "./paths/natureza/schemas/SED.yaml"
    
    CentroDeCusto:
      $ref: "./paths/centroDeCusto/schemas/CTT.yaml"
    
    CondicaoDePagamento:
      $ref: "./paths/condicaoDePagamento/schemas/SE4.yaml"

    LocaisDeEstoque:
      $ref: "./paths/locaisDeEstoque/schemas/NNR.yaml"

    UnidadeDeMedida:
      $ref: "./paths/unidadeDeMedida/schemas/SAH.yaml"

    ContaContabil:
      $ref: "./paths/contaContabil/schemas/CT1.yaml"

    SolicitacaoDeCompra:
      $ref: "./paths/solicitacaoDeCompra/schemas/SC1.yaml"

    PedidoDeCompra:
      $ref: "./paths/pedidoDeCompra/schemas/SE4.yaml"